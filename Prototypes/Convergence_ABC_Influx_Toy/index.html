<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convergence Toy</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #080d10; color: #dce6e8; font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 50%, #10242a, #080d10 68%); }
    canvas, svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    canvas { pointer-events: none; }
    svg { cursor: grab; touch-action: none; }
    svg:active { cursor: grabbing; }
    #controls { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 12px; border: 1px solid #486168; border-radius: 8px; background: rgba(8, 13, 16, 0.84); backdrop-filter: blur(8px); }
    label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    input[type="range"] { width: 96px; accent-color: #e1824b; }
    input[type="checkbox"] { accent-color: #e1824b; }
    output { min-width: 30px; color: #8fb4ba; }
    button { border: 1px solid #486168; border-radius: 4px; padding: 5px 9px; background: #142126; color: #dce6e8; font: inherit; cursor: pointer; }
    button:hover { border-color: #e1824b; color: #fff; }
    @media (max-width: 640px) { #controls { left: 8px; right: 8px; bottom: 8px; gap: 7px 10px; } input[type="range"] { width: 68px; } }
  </style>
</head>
<body>
  <main id="stage">
    <canvas id="field" aria-hidden="true"></canvas>
    <svg id="play" viewBox="0 0 1800 1200" preserveAspectRatio="xMidYMid slice" aria-label="Interactive convergence toy"></svg>
    <div id="controls" aria-label="Toy controls"></div>
  </main>
  <script>
  (() => {
    'use strict';

    const NS = 'http://www.w3.org/2000/svg';
    const WORLD = { width: 1800, height: 1200, extent: 3400 };
    const field = document.getElementById('field');
    const context = field.getContext('2d');
    const svg = document.getElementById('play');
    const controls = document.getElementById('controls');
    const bodies = [
      { name: 'A', x: 700, y: 600, radius: 84, vx: 0, vy: 0, active: true },
      { name: 'B', x: 1240, y: 600, radius: 60, vx: 0, vy: 0, active: true },
      { name: 'C', x: 960, y: 300, radius: 44, vx: 0, vy: 0, active: false }
    ];
    const home = bodies.map(({ x, y, radius }) => ({ x, y, radius }));
    const options = { paused: false, trails: false };
    const trails = bodies.map(() => []);
    const lines = [];
    const bodyNodes = [];
    const forceNodes = [];
    const labels = [];
    let heldBody = null;
    let previous = 0;
    let pointerTrail = [];

    function element(name, attributes) {
      const node = document.createElementNS(NS, name);
      Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
      return node;
    }

    function bodyMass(body) {
      return Math.pow(body.radius / 18, 3);
    }

    function buildLines() {
      const spacing = 86;
      for (let angle = 0; angle < 180; angle += 5) {
        const theta = angle * Math.PI / 180;
        const ux = Math.cos(theta);
        const uy = Math.sin(theta);
        const nx = -uy;
        const ny = ux;
        for (let offset = -1100; offset <= 1100; offset += spacing) {
          lines.push({ x: 900 + nx * offset, y: 600 + ny * offset, ux, uy, key: angle + offset });
        }
      }
    }

    function createScene() {
      const defs = element('defs', {});
      const arrow = element('marker', { id: 'force-arrow', markerWidth: 9, markerHeight: 9, refX: 7, refY: 3, orient: 'auto' });
      arrow.appendChild(element('path', { d: 'M0,0 L6,3 L0,6 Z', fill: '#e1824b' }));
      defs.appendChild(arrow);
      svg.appendChild(defs);

      bodies.forEach((body) => {
        const force = element('line', { stroke: '#e1824b', 'stroke-width': 5, 'marker-end': 'url(#force-arrow)' });
        const circle = element('circle', { fill: '#162c33', stroke: '#9bc5ca', 'stroke-width': 2 });
        const label = element('text', { 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: '#ffffff', 'font-size': 28, 'font-family': 'ui-monospace, monospace', 'pointer-events': 'none' });
        label.textContent = body.name;
        forceNodes.push(force);
        bodyNodes.push(circle);
        labels.push(label);
        svg.append(force, circle, label);
      });
    }

    function addControls() {
      bodies.forEach((body, index) => {
        const label = document.createElement('label');
        const caption = document.createElement('span');
        caption.textContent = body.name;
        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = '18';
        slider.max = '150';
        slider.step = '1';
        slider.value = String(body.radius);
        slider.setAttribute('aria-label', `${body.name} radius`);
        const output = document.createElement('output');
        output.value = String(body.radius);
        output.textContent = String(body.radius);
        slider.addEventListener('input', () => {
          body.radius = Number(slider.value);
          output.value = slider.value;
          output.textContent = slider.value;
        });
        label.append(caption, slider, output);

        if (index > 0) {
          const enabled = document.createElement('input');
          enabled.type = 'checkbox';
          enabled.checked = body.active;
          enabled.setAttribute('aria-label', `${body.name} enabled`);
          enabled.addEventListener('change', () => {
            body.active = enabled.checked;
            body.vx = 0;
            body.vy = 0;
            trails[index] = [];
          });
          label.prepend(enabled);
        }
        controls.appendChild(label);
      });

      const trailsLabel = document.createElement('label');
      const trailsToggle = document.createElement('input');
      trailsToggle.type = 'checkbox';
      trailsToggle.setAttribute('aria-label', 'Show trails');
      trailsToggle.addEventListener('change', () => {
        options.trails = trailsToggle.checked;
        if (!options.trails) trails.forEach((trail, index) => { trails[index] = []; });
      });
      trailsLabel.append(trailsToggle, document.createTextNode('trails'));
      controls.appendChild(trailsLabel);

      const pause = document.createElement('button');
      pause.type = 'button';
      pause.textContent = 'pause';
      pause.addEventListener('click', () => {
        options.paused = !options.paused;
        pause.textContent = options.paused ? 'run' : 'pause';
      });
      controls.appendChild(pause);

      const reset = document.createElement('button');
      reset.type = 'button';
      reset.textContent = 'reset';
      reset.addEventListener('click', () => {
        bodies.forEach((body, index) => {
          Object.assign(body, home[index], { vx: 0, vy: 0 });
          trails[index] = [];
        });
      });
      controls.appendChild(reset);
    }

    function lineInterval(line, body) {
      const dx = body.x - line.x;
      const dy = body.y - line.y;
      const along = dx * line.ux + dy * line.uy;
      const perpendicular = -dx * line.uy + dy * line.ux;
      if (Math.abs(perpendicular) >= body.radius) return null;
      const chord = Math.sqrt(body.radius * body.radius - perpendicular * perpendicular);
      return { from: along - chord, to: along + chord, chord };
    }

    function drawSegment(line, from, to, width, alpha) {
      const x1 = line.x + line.ux * from;
      const y1 = line.y + line.uy * from;
      const x2 = line.x + line.ux * to;
      const y2 = line.y + line.uy * to;
      context.globalAlpha = alpha;
      context.lineWidth = width;
      context.beginPath();
      context.moveTo(x1, y1);
      context.lineTo(x2, y2);
      context.stroke();
    }

    function paint(now) {
      const bounds = field.getBoundingClientRect();
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.round(bounds.width * pixelRatio));
      const height = Math.max(1, Math.round(bounds.height * pixelRatio));
      if (field.width !== width || field.height !== height) {
        field.width = width;
        field.height = height;
      }
      const scale = Math.max(width / WORLD.width, height / WORLD.height);
      const offsetX = (width - WORLD.width * scale) / 2;
      const offsetY = (height - WORLD.height * scale) / 2;
      context.setTransform(scale, 0, 0, scale, offsetX, offsetY);
      context.clearRect(-offsetX / scale, -offsetY / scale, width / scale, height / scale);
      context.lineCap = 'round';
      context.strokeStyle = '#70b8c3';

      lines.forEach((line) => {
        const intervals = bodies.filter((body) => body.active).map((body) => lineInterval(line, body)).filter(Boolean);
        if (!intervals.length) {
          drawSegment(line, -WORLD.extent, WORLD.extent, 1, 0.09);
          return;
        }
        const nearestNegative = intervals.reduce((value, interval) => Math.min(value, interval.from), WORLD.extent);
        const nearestPositive = intervals.reduce((value, interval) => Math.max(value, interval.to), -WORLD.extent);
        drawSegment(line, -WORLD.extent, nearestNegative, 1, 0.13);
        drawSegment(line, nearestPositive, WORLD.extent, 1, 0.13);
        drawSegment(line, nearestNegative - 24, nearestNegative, 3, 0.68);
        drawSegment(line, nearestPositive, nearestPositive + 24, 3, 0.68);
        const pulse = ((now * 0.09 + line.key * 17) % 260) - 130;
        if (pulse < nearestNegative - 28 && pulse > -WORLD.extent + 28) drawSegment(line, pulse - 12, pulse + 12, 2.5, 0.55);
        if (-pulse > nearestPositive + 28 && -pulse < WORLD.extent - 28) drawSegment(line, -pulse - 12, -pulse + 12, 2.5, 0.55);
      });

      if (options.trails) {
        context.strokeStyle = '#e1824b';
        context.lineWidth = 2;
        trails.forEach((trail) => {
          if (trail.length < 2) return;
          context.globalAlpha = 0.4;
          context.beginPath();
          context.moveTo(trail[0].x, trail[0].y);
          trail.slice(1).forEach((point) => context.lineTo(point.x, point.y));
          context.stroke();
        });
      }
      context.globalAlpha = 1;
    }

    function solveForces() {
      const forces = bodies.map(() => ({ x: 0, y: 0 }));
      for (let first = 0; first < bodies.length; first += 1) {
        const a = bodies[first];
        if (!a.active) continue;
        for (let second = first + 1; second < bodies.length; second += 1) {
          const b = bodies[second];
          if (!b.active) continue;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const distance = Math.max(Math.hypot(dx, dy), a.radius + b.radius + 2);
          const strength = 30 * a.radius * a.radius * b.radius * b.radius / (distance * distance);
          const ux = dx / distance;
          const uy = dy / distance;
          forces[first].x += ux * strength;
          forces[first].y += uy * strength;
          forces[second].x -= ux * strength;
          forces[second].y -= uy * strength;
        }
      }
      return forces;
    }

    function resolveContacts() {
      for (let first = 0; first < bodies.length; first += 1) {
        const a = bodies[first];
        if (!a.active) continue;
        for (let second = first + 1; second < bodies.length; second += 1) {
          const b = bodies[second];
          if (!b.active) continue;
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let distance = Math.hypot(dx, dy);
          const contact = a.radius + b.radius;
          if (distance >= contact) continue;
          if (distance < 0.001) { dx = 1; dy = 0; distance = 1; }
          const ux = dx / distance;
          const uy = dy / distance;
          const inverseA = 1 / bodyMass(a);
          const inverseB = 1 / bodyMass(b);
          const inverseTotal = inverseA + inverseB;
          const correction = (contact - distance) / inverseTotal;
          if (a !== heldBody) { a.x -= ux * correction * inverseA; a.y -= uy * correction * inverseA; }
          if (b !== heldBody) { b.x += ux * correction * inverseB; b.y += uy * correction * inverseB; }
          const relativeSpeed = (b.vx - a.vx) * ux + (b.vy - a.vy) * uy;
          if (relativeSpeed < 0) {
            const impulse = -1.2 * relativeSpeed / inverseTotal;
            a.vx -= impulse * ux * inverseA;
            a.vy -= impulse * uy * inverseA;
            b.vx += impulse * ux * inverseB;
            b.vy += impulse * uy * inverseB;
          }
        }
      }
    }

    function updateNodes(forces) {
      bodies.forEach((body, index) => {
        const circle = bodyNodes[index];
        const label = labels[index];
        const force = forceNodes[index];
        if (!body.active) {
          circle.setAttribute('visibility', 'hidden');
          label.setAttribute('visibility', 'hidden');
          force.setAttribute('visibility', 'hidden');
          return;
        }
        circle.setAttribute('visibility', 'visible');
        label.setAttribute('visibility', 'visible');
        circle.setAttribute('cx', body.x);
        circle.setAttribute('cy', body.y);
        circle.setAttribute('r', body.radius);
        label.setAttribute('x', body.x);
        label.setAttribute('y', body.y + 1);
        label.setAttribute('font-size', Math.max(16, body.radius * 0.35));
        const magnitude = Math.hypot(forces[index].x, forces[index].y);
        if (magnitude < 0.1) {
          force.setAttribute('visibility', 'hidden');
          return;
        }
        const ux = forces[index].x / magnitude;
        const uy = forces[index].y / magnitude;
        const length = Math.max(28, Math.min(220, magnitude * 0.08));
        force.setAttribute('visibility', 'visible');
        force.setAttribute('x1', body.x + ux * (body.radius + 10));
        force.setAttribute('y1', body.y + uy * (body.radius + 10));
        force.setAttribute('x2', body.x + ux * (body.radius + 10 + length));
        force.setAttribute('y2', body.y + uy * (body.radius + 10 + length));
      });
    }

    function toWorld(event) {
      const bounds = svg.getBoundingClientRect();
      return { x: (event.clientX - bounds.left) / bounds.width * WORLD.width, y: (event.clientY - bounds.top) / bounds.height * WORLD.height };
    }

    function closestBody(point) {
      return bodies.filter((body) => body.active).reduce((closest, body) => {
        const distance = Math.hypot(point.x - body.x, point.y - body.y);
        return !closest || distance < closest.distance ? { body, distance } : closest;
      }, null)?.body ?? null;
    }

    svg.addEventListener('pointerdown', (event) => {
      const point = toWorld(event);
      const candidate = closestBody(point);
      if (!candidate || Math.hypot(point.x - candidate.x, point.y - candidate.y) > candidate.radius) return;
      heldBody = candidate;
      heldBody.vx = 0;
      heldBody.vy = 0;
      pointerTrail = [{ ...point, time: performance.now() }];
      svg.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    svg.addEventListener('pointermove', (event) => {
      if (!heldBody) return;
      const point = toWorld(event);
      heldBody.x = Math.max(heldBody.radius, Math.min(WORLD.width - heldBody.radius, point.x));
      heldBody.y = Math.max(heldBody.radius, Math.min(WORLD.height - heldBody.radius, point.y));
      pointerTrail.push({ ...point, time: performance.now() });
      if (pointerTrail.length > 8) pointerTrail.shift();
    });

    function releaseBody() {
      if (heldBody && pointerTrail.length > 1) {
        const start = pointerTrail[0];
        const end = pointerTrail[pointerTrail.length - 1];
        const elapsed = (end.time - start.time) / 1000;
        if (elapsed > 0.008) {
          heldBody.vx = Math.max(-1100, Math.min(1100, (end.x - start.x) / elapsed));
          heldBody.vy = Math.max(-1100, Math.min(1100, (end.y - start.y) / elapsed));
        }
      }
      heldBody = null;
      pointerTrail = [];
    }
    window.addEventListener('pointerup', releaseBody);
    window.addEventListener('pointercancel', releaseBody);

    function frame(now) {
      requestAnimationFrame(frame);
      const elapsed = Math.min(0.034, (now - previous) / 1000 || 0);
      previous = now;
      const forces = solveForces();
      if (!options.paused && elapsed > 0) {
        bodies.forEach((body, index) => {
          if (!body.active || body === heldBody) return;
          body.vx += forces[index].x / bodyMass(body) * elapsed;
          body.vy += forces[index].y / bodyMass(body) * elapsed;
          body.x += body.vx * elapsed;
          body.y += body.vy * elapsed;
          if (options.trails) {
            trails[index].push({ x: body.x, y: body.y });
            if (trails[index].length > 220) trails[index].shift();
          }
        });
        resolveContacts();
      }
      paint(now);
      updateNodes(forces);
    }

    buildLines();
    createScene();
    addControls();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>

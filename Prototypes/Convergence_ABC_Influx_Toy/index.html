<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planar Solid-Angle Occlusion Experiment</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #05080c; color: #e4eff0; font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #stage { position: relative; background: radial-gradient(circle at 50% 50%, #112831 0, #080e13 32%, #05080c 74%); }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    #controls, #readout { position: absolute; border: 1px solid #45626a; border-radius: 8px; background: rgba(5, 8, 12, .9); backdrop-filter: blur(9px); }
    #controls { left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 12px; }
    #readout { top: 16px; right: 16px; width: min(380px, calc(100% - 32px)); padding: 10px 12px; color: #b8ced2; }
    #readout strong { color: #fff5d3; }
    #readout .warn { color: #ffcf8a; }
    #readout .fail { color: #ff9b93; }
    button { border: 1px solid #45626a; border-radius: 4px; padding: 5px 9px; background: #122128; color: #dcebed; font: inherit; cursor: pointer; }
    button:hover, button[aria-pressed="true"] { border-color: #e69a5c; color: #fff; }
    label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    input { accent-color: #e69a5c; }
    input[type="range"] { width: 100px; }
    output { min-width: 4.5em; color: #8fc6cf; }
    @media (max-width: 720px) { #controls { left: 8px; right: 8px; bottom: 8px; gap: 6px 8px; } #readout { top: 8px; right: 8px; width: calc(100% - 16px); } input[type="range"] { width: 72px; } }
  </style>
</head>
<body>
  <main id="stage">
    <canvas id="solar" aria-label="Planar solid-angle occlusion dynamics experiment"></canvas>
    <div id="readout" aria-live="polite">Loading JPL initial states and constructing the CMB-pressure run.</div>
    <div id="controls" aria-label="Planar occlusion experiment controls"></div>
  </main>
  <script src="planar-occlusion.js"></script>
</body>
</html>

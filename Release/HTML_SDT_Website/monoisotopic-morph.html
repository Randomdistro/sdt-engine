/* ═══════════════════════════════════════════
   PROCESS
   ═══════════════════════════════════════════ */
const ISO = RAW.map(([sym,Z,A,abd,stable]) => {
  const N = A - Z;
  return { sym, Z, A, N, abd, stable };
});

// Find monoisotopic elements
const countByZ = {};
ISO.forEach(e => { if (e.stable || e.abd > 0) countByZ[e.Z] = (countByZ[e.Z]||0)+1; });
const MONO_Z = new Set();
for (const [z,c] of Object.entries(countByZ)) { if (c===1) MONO_Z.add(+z); }

// Monoisotopic points for fit
const monoPts = [];
ISO.forEach(e => { if (MONO_Z.has(e.Z) && (e.stable||e.abd>0)) monoPts.push(e); });

// Linear fit N = m*Z + b through monoisotopic (N vs Z)
function linFit(pts) {
  const n=pts.length; let sx=0,sy=0,sxy=0,sx2=0;
  pts.forEach(p => { sx+=p.Z; sy+=p.N; sxy+=p.Z*p.N; sx2+=p.Z*p.Z; });
  const m=(n*sxy-sx*sy)/(n*sx2-sx*sx), b=(sy-m*sx)/n;
  return {m,b};
}
const fit = linFit(monoPts);
function Nfit(Z) { return fit.m * Z + fit.b; }

// Golden line: 50/50 d:t → N = 0.5*Z (since each position adds 1P, 50% d adds 1N, 50% t adds 2N → avg 1.5N per P beyond alpha)
// Actually: A = 2.5Z - 1, N = A-Z = 1.5Z - 1
function Ngolden(Z) { return 1.5 * Z - 1; }

// Compute residuals
ISO.forEach(e => {
  e.mono = MONO_Z.has(e.Z);
  e.Nresid = e.N - Nfit(e.Z);
});

const MAGIC = [2,8,20,28,50,82];

/* ═══════════════════════════════════════════
   CANVAS + PAN/ZOOM
   ═══════════════════════════════════════════ */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W, H;
function resize() { W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
addEventListener("resize",()=>{resize();draw();});
resize();

let panX=0, panY=0, zoom=1;
let dragging=false, lastX, lastY;
canvas.addEventListener("mousedown",e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
addEventListener("mouseup",()=>dragging=false);
canvas.addEventListener("mousemove",e=>{
  if(dragging){panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;draw();}
  handleHover(e);
});
canvas.addEventListener("wheel",e=>{
  const f=e.deltaY>0?0.92:1.08;
  const mx=e.clientX, my=e.clientY;
  panX=(panX-mx)*f+mx; panY=(panY-my)*f+my;
  zoom*=f; draw(); e.preventDefault();
},{passive:false});

/* ═══════════════════════════════════════════
   TILE GEOMETRY
   ═══════════════════════════════════════════ */
const CW = 18; // cell width
const CH = 11; // cell height
let morphT = 0;

function tilePos(e) {
  // Base position: N on x, Z on y (y goes up)
  // Stretcherbond: odd Z rows shift right by half cell
  const offset = (e.Z % 2 === 1) ? CW * 0.5 : 0;
  const xActual = e.N * CW + offset;
  const xStraight = e.Nresid * CW + offset;
  const x = xActual * (1 - morphT) + xStraight * morphT;
  const y = -e.Z * CH; // negative so Z goes up
  return { x, y };
}

function toScreen(tx, ty) {
  return {
    x: W/2 + (tx + panX) * zoom,
    y: H/2 + (ty + panY) * zoom
  };
}

/* ═══════════════════════════════════════════
   DRAW
   ═══════════════════════════════════════════ */
function draw() {
  ctx.clearRect(0,0,W,H);
  const cw = CW * zoom, ch = CH * zoom;

  // ── Magic Z lines ──
  MAGIC.forEach(mz => {
    const y0 = toScreen(-200, -mz*CH).y;
    ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(W,y0);
    ctx.strokeStyle="rgba(80,180,255,0.07)"; ctx.lineWidth=Math.max(1,ch*0.8);
    ctx.stroke();
    // Label at left edge
    ctx.font=`${Math.max(8,9*zoom)}px 'Segoe UI',sans-serif`;
    ctx.fillStyle="rgba(80,180,255,0.35)";
    ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText(`Z=${mz}`, 8, y0);
  });

  // ── Golden line ──
  ctx.beginPath();
  ctx.setLineDash([4,3]);
  for (let z=2;z<=83;z++){
    const ng = Ngolden(z);
    const offset = (z%2===1)?CW*0.5:0;
    const xA = ng*CW + offset;
    const xS = (ng - Nfit(z))*CW + offset;
    const tx = xA*(1-morphT) + xS*morphT;
    const p = toScreen(tx + CW*0.5, -z*CH - CH*0.5);
    z===2 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y);
  }
  ctx.strokeStyle="rgba(106,90,205,0.45)"; ctx.lineWidth=1.5*zoom; ctx.stroke();
  ctx.setLineDash([]);

  // ── Monoisotopic centreline ──
  ctx.beginPath();
  for (let z=2;z<=83;z++){
    const nf = Nfit(z);
    const offset = (z%2===1)?CW*0.5:0;
    const xA = nf*CW + offset;
    const xS = 0*CW + offset; // residual=0
    const tx = xA*(1-morphT) + xS*morphT;
    const p = toScreen(tx + CW*0.5, -z*CH - CH*0.5);
    z===2 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y);
  }
  ctx.strokeStyle="rgba(212,160,92,0.25)"; ctx.lineWidth=1.5*zoom; ctx.stroke();

  // ── Tiles ──
  ISO.forEach(e => {
    const tp = tilePos(e);
    const sp = toScreen(tp.x, tp.y);
    const w = cw - 1, h = ch - 1;

    // Tile fill
    if (e.mono) {
      // Monoisotopic: warm gold
      ctx.fillStyle = "rgba(180,130,50,0.85)";
      // Glow
      ctx.shadowColor = "rgba(212,160,92,0.4)";
      ctx.shadowBlur = 6 * zoom;
    } else if (e.stable) {
      ctx.fillStyle = "rgba(30,110,80,0.7)";
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = "rgba(120,30,45,0.6)";
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0;
    }

    ctx.fillRect(sp.x, sp.y, w, h);
    ctx.shadowColor = "transparent"; ctx.shadowBlur = 0;

    // Border
    ctx.strokeStyle = e.mono ? "rgba(255,200,100,0.6)" : "rgba(255,255,255,0.06)";
    ctx.lineWidth = e.mono ? 1 : 0.5;
    ctx.strokeRect(sp.x, sp.y, w, h);

    // Label (if zoomed enough)
    if (cw > 14) {
      ctx.font = `${e.mono?"bold ":""}${Math.max(6,Math.min(9,cw*0.45))}px 'Segoe UI',sans-serif`;
      ctx.fillStyle = e.mono ? "rgba(255,230,170,0.95)" : "rgba(255,255,255,0.45)";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const label = cw > 28 ? `${e.sym}${e.A}` : (cw > 18 ? `${e.A}` : "");
      ctx.fillText(label, sp.x + w/2, sp.y + h/2);
    }

    // Store screen rect for hover
    e._sx = sp.x; e._sy = sp.y; e._sw = w; e._sh = h;
  });

  // ── Sole-line label at t=1 ──
  if (morphT > 0.4) {
    const a = Math.min(1, (morphT - 0.4) / 0.3);
    const p = toScreen(CW*0.5, -42*CH);
    ctx.save();
    ctx.translate(p.x - 14*zoom, p.y);
    ctx.rotate(-Math.PI/2);
    ctx.font = `bold ${Math.max(9,11*zoom)}px 'Segoe UI',sans-serif`;
    ctx.fillStyle = `rgba(212,160,92,${0.7*a})`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("SOLE ISOTOPE LINE", 0, 0);
    ctx.restore();
  }

  // ── Info bar ──
  ctx.font = "9px 'Segoe UI',sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.2)";
  ctx.textAlign = "left"; ctx.textBaseline = "bottom";
  ctx.fillText(`N = ${fit.m.toFixed(4)}·Z ${fit.b>0?"+":""}${fit.b.toFixed(2)}  |  slope → ${((fit.m/(fit.m+1))*100).toFixed(1)}% neutron excess per position  |  ${monoPts.length} monoisotopic elements`, 14, H-60);
}

/* ═══════════════════════════════════════════
   HOVER TOOLTIP
   ═══════════════════════════════════════════ */
const tooltip = document.getElementById("tooltip");
function handleHover(ev) {
  const mx=ev.clientX, my=ev.clientY;
  let hit = null;
  for (const e of ISO) {
    if (mx >= e._sx && mx <= e._sx+e._sw && my >= e._sy && my <= e._sy+e._sh) { hit=e; break; }
  }
  if (hit) {
    const nd = 3*hit.Z - hit.A - 2, nt = hit.A - 2*hit.Z;
    tooltip.style.display = "block";
    tooltip.style.left = (mx+14)+"px"; tooltip.style.top = (my-10)+"px";
    tooltip.innerHTML = `
      <div class="tt-sym">${hit.sym}-${hit.A}${hit.mono?" ★":""}</div>
      <div class="tt-row">Z=<span class="tt-val">${hit.Z}</span>  N=<span class="tt-val">${hit.N}</span>  A=<span class="tt-val">${hit.A}</span></div>
      <div class="tt-row">Grammar: <span class="tt-val">${nd>=0?nd:"?"}d + ${nt>=0?nt:"?"}t</span></div>
      <div class="tt-row">ΔN from fit: <span class="tt-val">${hit.Nresid>=0?"+":""}${hit.Nresid.toFixed(2)}</span></div>
      <div class="tt-row">${hit.stable?"Stable":"Unstable"} · ${hit.abd}%</div>
    `;
  } else {
    tooltip.style.display = "none";
  }
}

/* ═══════════════════════════════════════════
   ANIMATION CONTROLS
   ═══════════════════════════════════════════ */
const slider = document.getElementById("morphSlider");
const mlabel = document.getElementById("morphLabel");
const btnPlay = document.getElementById("btnPlay");
const btnReset = document.getElementById("btnReset");

slider.addEventListener("input",()=>{
  morphT=+slider.value/1000; mlabel.textContent=Math.round(morphT*100)+"%";
  playing=false; btnPlay.textContent="▶ Play"; btnPlay.classList.remove("active"); draw();
});

let playing=false, animDir=1, animFrame=null;
function animate(){
  if(!playing)return;
  morphT += 0.0025*animDir;
  if(morphT>=1){morphT=1;animDir=-1;}
  if(morphT<=0){morphT=0;animDir=1;}
  slider.value=Math.round(morphT*1000);
  mlabel.textContent=Math.round(morphT*100)+"%";
  draw();
  animFrame=requestAnimationFrame(animate);
}
btnPlay.addEventListener("click",()=>{
  playing=!playing;
  if(playing){btnPlay.textContent="⏸ Pause";btnPlay.classList.add("active");if(morphT>=1)animDir=-1;if(morphT<=0)animDir=1;animate();}
  else{btnPlay.textContent="▶ Play";btnPlay.classList.remove("active");if(animFrame)cancelAnimationFrame(animFrame);}
});
btnReset.addEventListener("click",()=>{
  playing=false;btnPlay.textContent="▶ Play";btnPlay.classList.remove("active");
  morphT=0;animDir=1;slider.value=0;mlabel.textContent="0%";
  panX=0;panY=0;zoom=1;draw();
});

// ── Initial pan to centre on ~Z=40 ──
panY = 40 * CH;
panX = -45 * CW;
draw();
</script>

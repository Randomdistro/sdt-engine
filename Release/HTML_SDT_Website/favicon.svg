  <g style="--c:#ff9e12" filter="url(#glow)">
    <circle class="ring-soft" cx="450" cy="430" r="36"/>
    <circle class="node" cx="450" cy="430" r="32"/>
    <circle class="ring" cx="450" cy="430" r="26"/>
    <path class="tick" d="M412 430h8M480 430h8"/>

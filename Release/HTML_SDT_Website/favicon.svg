  </g>
  <g style="--c:#ff5a17" filter="url(#glow)">
    <circle class="ring-soft" cx="320" cy="500" r="34"/>
    <circle class="node" cx="320" cy="500" r="30"/>
    <circle class="ring" cx="320" cy="500" r="24"/>

    <circle class="node" cx="320" cy="350" r="30"/>
    <circle class="ring" cx="320" cy="350" r="24"/>
    <text class="label label-small" x="320" y="352">Be</text>
  </g>
  <g style="--c:#ff9e12" filter="url(#glow)">
    <circle class="ring-soft" cx="190" cy="430" r="36"/>
    <circle class="node" cx="190" cy="430" r="32"/>
    <circle class="ring" cx="190" cy="430" r="26"/>
    <path class="tick" d="M152 430h8M220 430h8"/>
    <text class="label label-small" x="190" y="432">Li</text>
